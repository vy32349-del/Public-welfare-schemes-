<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know Your Schemes – Public welfare schemes in India</title>
<style>
:root{
  --bg:#f3f6f1;--surface:#ffffff;--ink:#1d2a24;--muted:#56645d;--line:#d5ddd6;
  --green:#1f5d46;--green-ink:#ffffff;--saffron:#e08a1e;--tint:#e4eee7;--focus:#0b57d0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121a16;--surface:#1a2520;--ink:#e8efea;--muted:#a3b1a9;--line:#2c3b34;--green:#6fc4a0;--green-ink:#0e1c16;--saffron:#f0a64a;--tint:#22332b;--focus:#8ab4f8}
}
:root[data-theme="dark"]{--bg:#121a16;--surface:#1a2520;--ink:#e8efea;--muted:#a3b1a9;--line:#2c3b34;--green:#6fc4a0;--green-ink:#0e1c16;--saffron:#f0a64a;--tint:#22332b;--focus:#8ab4f8}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3","Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:14px;padding-bottom:14px;gap:12px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:1.15rem}
.brand span{color:var(--saffron)}
nav a{margin-left:18px;text-decoration:none;color:var(--ink);font-weight:600}
nav a:hover{text-decoration:underline}
.hero{padding:48px 0 32px}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);max-width:16ch}
.hero p{max-width:56ch;color:var(--muted);font-size:1.1rem;margin:16px 0 24px}
.search{display:flex;gap:8px;max-width:620px}
.search input{flex:1;min-width:0;padding:14px 16px;font:inherit;border:2px solid var(--green);border-radius:8px;background:var(--surface);color:var(--ink)}
.search button{padding:0 20px;font:inherit;font-weight:700;border:0;border-radius:8px;background:var(--green);color:var(--green-ink);cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 8px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.95rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.count{color:var(--muted);margin:8px 0 16px;font-size:.95rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:40px}
.scheme{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;padding:18px}
.scheme h3{font-size:1.2rem}
.tag{display:inline-block;font-size:.85rem;color:var(--green);background:var(--tint);padding:2px 10px;border-radius:4px;margin-bottom:10px}
.scheme p{margin:8px 0;color:var(--muted)}
.scheme button.more{margin-top:6px;padding:0;border:0;background:none;color:var(--green);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.detail{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:.97rem}
.detail.open{display:block}
.detail dt{font-weight:700;margin-top:8px}
.detail dd{margin:2px 0 0;color:var(--muted)}
.empty{grid-column:1/-1;padding:24px;background:var(--surface);border:1px dashed var(--line);border-radius:6px}
section.check{background:var(--tint);padding:40px 0}
section.check h2{font-size:1.6rem;margin-bottom:6px}
.check form,.check .row{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.check label{display:flex;flex-direction:column;font-weight:600;font-size:.95rem;gap:4px}
.check select{padding:10px;font:inherit;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:170px}
#result{margin-top:8px}
#result li{margin:4px 0}
section.how{padding:40px 0}
section.how h2{font-size:1.6rem;margin-bottom:16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.steps li::before{content:"Step " counter(s);display:block;font-weight:700;color:var(--saffron);margin-bottom:4px}
footer{border-top:1px solid var(--line);padding:24px 0 32px;color:var(--muted);font-size:.92rem;background:var(--surface)}
.help{font-weight:700;color:var(--ink)}
@media (max-width:560px){nav{display:none}.search button{padding:0 14px}}
.lang{display:flex;gap:6px}.lang .chip{padding:6px 12px}.top .wrap{flex-wrap:wrap}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" data-i18n="brand"></div>
  <nav aria-label="Main"><a href="#schemes" data-i18n="n1"></a><a href="#check" data-i18n="n2"></a><a href="#how" data-i18n="n3"></a></nav>
  <div class="lang" role="group" aria-label="Language"><button class="chip" data-l="en">English</button><button class="chip" data-l="hi">हिन्दी</button><button class="chip" data-l="mr">मराठी</button></div>
</div></header>
<main>
<section class="hero"><div class="wrap">
  <h1 data-i18n="h1"></h1>
  <p data-i18n="hp"></p>
  <form class="search" role="search" onsubmit="return false">
    <input id="q" type="search" data-ph="ph" aria-label="Search" oninput="render()">
    <button type="button" onclick="render()" data-i18n="sb"></button>
  </form>
</div></section>
<section id="schemes"><div class="wrap">
  <div class="filters" id="filters" role="group"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div class="list" id="list"></div>
</div></section>
<section class="check" id="check"><div class="wrap">
  <h2 data-i18n="ch2"></h2>
  <p data-i18n="cp"></p>
  <div class="row">
    <label><span data-i18n="q1"></span><select id="f-who"><option value="" data-i18n="sel"></option><option value="farmer" data-i18n="farmer"></option><option value="woman" data-i18n="woman"></option><option value="girl" data-i18n="girl"></option><option value="worker" data-i18n="worker"></option><option value="senior" data-i18n="senior"></option><option value="family" data-i18n="family"></option></select></label>
    <label><span data-i18n="q2"></span><select id="f-inc"><option value="" data-i18n="sel"></option><option value="low" data-i18n="low"></option><option value="mid" data-i18n="mid"></option></select></label>
    <label><span data-i18n="q3"></span><select id="f-bank"><option value="" data-i18n="sel"></option><option value="yes" data-i18n="yes"></option><option value="no" data-i18n="no"></option></select></label>
  </div>
  <button class="chip" style="background:var(--green);color:var(--green-ink);border-color:var(--green)" onclick="shortlist()" data-i18n="show"></button>
  <ul id="result" aria-live="polite"></ul>
</div></section>
<section class="how" id="how"><div class="wrap">
  <h2 data-i18n="hw"></h2>
  <ol class="steps"><li data-i18n="s1"></li><li data-i18n="s2"></li><li data-i18n="s3"></li><li data-i18n="s4"></li></ol>
</div></section>
</main>
<footer><div class="wrap"><p data-i18n="f1"></p><p data-i18n="f2"></p></div></footer>
